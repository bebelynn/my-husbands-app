<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ffe6f0, #fff0f5);
  overflow-x: hidden;
}

/* screens */
.screen { display: none; padding: 20px; }
.active { display: block; }

/* card */
.card {
  margin: 60px auto;
  width: 90%;
  max-width: 420px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

/* message */
#message {
  margin: 20px 0;
  font-size: 18px;
  min-height: 90px;
  white-space: pre-wrap;
  line-height: 1.6;
  color: #444;
  opacity: 1;
  transition: opacity 0.3s ease;
}

/* buttons */
button {
  padding: 14px 22px;
  margin: 8px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(135deg, #ff4d88, #ff85a2);
  color: white;
  font-size: 15px;
  box-shadow: 0 5px 15px rgba(255,77,136,0.3);
}

/* gallery */
.gallery img {
  width: 90%;
  margin: 10px 0;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

/* popup */
#popup {
  position: fixed;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #ff4d88, #ff85a2);
  color: white;
  padding: 15px 25px;
  border-radius: 20px;
  transition: 0.5s;
  z-index: 999;
}

/* floating hearts */
.heart {
  position: absolute;
  color: #ff4d88;
  animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* burst hearts */
.burst-heart {
  position: fixed;
  font-size: 20px;
  animation: burst 1s ease forwards;
}

@keyframes burst {
  0% { opacity: 1; transform: scale(1); }
  100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="popup"></div>

<!-- LOCK -->
<div id="lock" class="screen active">
  <div class="card">
    <h2>Enter our date 💕</h2>
    <input type="password" id="pass" placeholder="dd/mm/yyyy"><br><br>
    <button onclick="unlock()">Enter</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="card">
    <h1>For You ❤️</h1>
    <p>Since July 4, 2023… forever to go 💕</p>
    <p id="days"></p>
    <button onclick="startApp()">Open your gift 💌</button>
  </div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
  <div class="card">
    <h1>Hi my love ❤️</h1>
    <div id="message">Tap the button ❤️</div>

    <button onclick="showMessage(this)">Tap me 💌</button>
    <button onclick="missMe(this)">Open when you miss me 🤍</button>
    <button onclick="showGallery()">Our memories 📸</button>
  </div>
</div>

<!-- GALLERY -->
<div id="gallery" class="screen">
  <div class="card gallery">
    <h2>Our memories 📸</h2>
    <img src="pic1.jpg">
    <img src="pic2.jpg">
    <img src="pic3.jpg">
    <img src="pic4.jpg">
    <img src="pic5.jpg">
    <img src="pic6.jpg">
    <br>
    <button onclick="goMain()">Back 💖</button>
  </div>
</div>

<script>
const messages = [
"I love your smile, your mind, everything about you ❤️",
"You are my life, my family",
"You make me a better person every day",
"You are my sun and moon and stars",
"I still can’t believe I have you",
"You deserve to feel amazing always",
"I am always your best friend and your home",
"I am so proud of you ❤️"
];

let firstMessage = true;
let typingInterval = null;

/* unlock */
function unlock() {
  const val = document.getElementById("pass").value;
  if (val === "04/07/2023" || val === "04072023") {
    showScreen("home");
  } else {
    alert("Wrong 😘");
  }
}

/* navigation */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startApp() {
  document.getElementById("music").play();
  showScreen("main");
  popupLoop();
}

/* typing FIX */
function typeText(text) {
  const el = document.getElementById("message");

  if (typingInterval) clearInterval(typingInterval);

  el.innerText = "";
  let i = 0;

  typingInterval = setInterval(() => {
    el.innerText = text.slice(0, i + 1);
    i++;
    if (i >= text.length) clearInterval(typingInterval);
  }, 35);
}

/* buttons */
function showMessage(btn) {
  burst(btn);

  if (firstMessage) {
    firstMessage = false;
    typeText("Happy best greatest most perfect husband day ever ❤️");
    return;
  }

  const msg = messages[Math.floor(Math.random()*messages.length)];
  typeText(msg);
}

function missMe(btn) {
  burst(btn);
  typeText("No matter where you are, I am always with you. I love you endlessly ❤️");
}

/* gallery */
function showGallery() { showScreen("gallery"); }
function goMain() { showScreen("main"); }

/* days */
const start = new Date("2023-07-04");
const end = new Date("2026-04-18");
document.getElementById("days").innerText =
Math.ceil((end-start)/(1000*60*60*24)) + " days together ❤️";

/* popup notifications */
const popupMsgs = [
"I love you ❤️",
"thinking about you",
"you’re my favorite person",
"I miss you already",
"forever yours ❤️"
];

function popupLoop() {
  setTimeout(()=>{
    const p = document.getElementById("popup");
    p.innerText = popupMsgs[Math.floor(Math.random()*popupMsgs.length)];
    p.style.top="20px";

    setTimeout(()=>p.style.top="-100px",4000);

    popupLoop();
  }, Math.random()*40000+20000);
}

/* heart burst */
function burst(btn) {
  const rect = btn.getBoundingClientRect();

  for(let i=0;i<10;i++){
    const h=document.createElement("div");
    h.className="burst-heart";
    h.innerText="💖";

    h.style.left = rect.left + rect.width/2 + "px";
    h.style.top = rect.top + "px";

    h.style.setProperty("--x",(Math.random()-0.5)*200+"px");
    h.style.setProperty("--y",(Math.random()-1)*200+"px");

    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }
}

/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},500);
</script>

</body>
</html>
